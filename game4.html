<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game</title>
    <link rel="icon" href="./favicon.ico" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Jua&family=Gamja+Flower&display=swap");
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --sky-top: #0c1b45;
        --sky-mid: #1e3f86;
        --sky-low: #7fb2ec;
        --cream: #fbf7ee;
        --wood: #dfe7f5;
        --fire: #ff9a52;
        --fire-dark: #e2702a;
        --tent: #4a90d9;
        --tent-dark: #2f6cae;
        --star: #ffe36b;
        --ink: #2c3556;
        --correct: #58c98a;
        --correct-dark: #379966;
        --wrong: #ff5c6c;
        --wrong-dark: #d63c4c;
      }

      body {
        font-family: "Jua", sans-serif;
        color: var(--ink);
      }

      .container {
        background: linear-gradient(
          160deg,
          var(--sky-top) 0%,
          var(--sky-mid) 55%,
          var(--sky-low) 100%
        );
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
        position: relative;
        padding: 24px;
      }

      /* 반짝이는 별들 */
      .star {
        position: fixed;
        color: var(--star);
        opacity: 0.9;
        animation: twinkle 2.4s ease-in-out infinite;
        pointer-events: none;
        user-select: none;
        z-index: 1;
      }
      .star:nth-child(1) {
        top: 10%;
        left: 12%;
        font-size: 1.4rem;
        animation-delay: 0s;
      }
      .star:nth-child(2) {
        top: 20%;
        left: 80%;
        font-size: 1rem;
        animation-delay: 0.6s;
      }
      .star:nth-child(3) {
        top: 7%;
        left: 55%;
        font-size: 0.9rem;
        animation-delay: 1.1s;
      }
      .star:nth-child(4) {
        top: 28%;
        left: 30%;
        font-size: 1.2rem;
        animation-delay: 1.6s;
      }
      .star:nth-child(5) {
        top: 14%;
        left: 90%;
        font-size: 0.8rem;
        animation-delay: 0.3s;
      }
      .star:nth-child(6) {
        top: 38%;
        left: 6%;
        font-size: 1rem;
        animation-delay: 2s;
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.25;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1.15);
        }
      }

      /* 상단 타이틀 */
      .title {
        color: var(--cream);
        font-family: "Jua", sans-serif;
        font-size: clamp(2rem, 6vw, 3.4rem);
        letter-spacing: 2px;
        margin-bottom: 24px;
        text-shadow: 0 3px 0 rgba(0, 0, 0, 0.18);
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 2;
      }

      .screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 2;
        width: 100%;
      }
      .screen.hidden {
        display: none;
      }

      /* ---------- 시작 화면 ---------- */
      .start-card {
        background: var(--cream);
        border: 6px solid var(--wood);
        border-radius: 32px;
        padding: clamp(32px, 6vw, 56px);
        width: min(480px, 90vw);
        text-align: center;
        box-shadow:
          0 14px 0 rgba(0, 0, 0, 0.15),
          inset 0 0 0 3px rgba(255, 255, 255, 0.6);
        animation: pop 0.45s cubic-bezier(0.22, 1.4, 0.4, 1);
      }
      .field-label {
        font-size: clamp(1rem, 2.4vw, 1.3rem);
        margin-bottom: 12px;
        color: var(--ink);
      }
      .team-input {
        width: 100%;
        font-family: "Jua", sans-serif;
        font-size: clamp(1.1rem, 2.6vw, 1.4rem);
        padding: 14px 16px;
        border-radius: 16px;
        border: 4px solid var(--wood);
        text-align: center;
        margin-bottom: 28px;
        background: #fff;
        color: var(--ink);
      }
      .team-input:focus {
        outline: none;
        border-color: var(--tent);
      }
      .count-buttons {
        display: flex;
        gap: 16px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .count-btn {
        font-family: inherit;
        font-size: clamp(1.1rem, 2.6vw, 1.4rem);
        padding: 18px 28px;
        border-radius: 20px;
        border: none;
        background: var(--tent);
        color: #fff;
        cursor: pointer;
        box-shadow: 0 7px 0 var(--tent-dark);
        transition:
          transform 0.08s ease,
          box-shadow 0.08s ease;
      }
      .count-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 9px 0 var(--tent-dark);
      }
      .count-btn:active {
        transform: translateY(5px);
        box-shadow: 0 2px 0 var(--tent-dark);
      }

      /* 남은 문제 수 안내 */
      .pool-note {
        margin-top: 18px;
        font-size: clamp(0.85rem, 2vw, 1rem);
        color: var(--tent-dark);
      }

      /* ---------- 게임 화면 ---------- */
      .hud {
        display: flex;
        gap: clamp(10px, 3vw, 28px);
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        background: var(--cream);
        border: 4px solid var(--wood);
        border-radius: 20px;
        padding: 10px 22px;
        margin-bottom: 20px;
        font-size: clamp(0.9rem, 2vw, 1.1rem);
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15);
        z-index: 2;
      }

      .image-container {
        z-index: 2;
        text-align: center;
      }
      .image-container img {
        width: min(760px, 88vw);
        max-height: 62vh;
        object-fit: contain;
        height: auto;
        background: var(--cream);
        border: 8px solid var(--wood);
        border-radius: 28px;
        box-shadow: 0 14px 0 rgba(0, 0, 0, 0.18);
        display: block;
      }
      /* 정답 이미지일 때 테두리 색 */
      .image-container img.is-answer {
        border-color: var(--correct);
      }
      .stage-label {
        margin-top: 14px;
        font-size: clamp(1.1rem, 3vw, 1.5rem);
        color: var(--cream);
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
      }

      /* O / X 버튼 - 화면 양쪽 */
      .side-btn {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        font-family: inherit;
        border-radius: 50%;
        width: clamp(64px, 10vw, 96px);
        height: clamp(64px, 10vw, 96px);
        font-size: clamp(1.8rem, 4vw, 2.6rem);
        color: #fff;
        border: none;
        cursor: pointer;
        z-index: 3;
        transition:
          transform 0.08s ease,
          box-shadow 0.08s ease;
      }
      .correct-btn {
        left: clamp(12px, 4vw, 48px);
        background: var(--correct);
        box-shadow: 0 7px 0 var(--correct-dark);
      }
      .wrong-btn {
        right: clamp(12px, 4vw, 48px);
        background: var(--wrong);
        box-shadow: 0 7px 0 var(--wrong-dark);
      }
      .side-btn:hover {
        transform: translateY(calc(-50% - 2px));
      }
      .side-btn:active {
        transform: translateY(calc(-50% + 5px));
      }
      .side-btn.hidden {
        display: none;
      }

      @media (max-width: 700px) {
        .side-btn {
          position: static;
          transform: none;
          margin: 18px 10px 0;
        }
        .side-btn:hover,
        .side-btn:active {
          transform: none;
        }
        .game-controls {
          display: flex;
          justify-content: center;
        }
      }

      /* 정답 공개 후 패널 (판정 + 다음 버튼) */
      .reveal-panel {
        width: min(760px, 88vw);
        margin-top: 22px;
        text-align: center;
        background: var(--cream);
        border: 6px solid var(--wood);
        padding: clamp(20px, 4vw, 32px) 24px;
        border-radius: 28px;
        box-shadow:
          0 14px 0 rgba(0, 0, 0, 0.15),
          inset 0 0 0 3px rgba(255, 255, 255, 0.6);
        z-index: 2;
        animation: pop 0.4s cubic-bezier(0.22, 1.4, 0.4, 1);
      }
      .reveal-panel.hidden {
        display: none;
      }
      .reveal-panel.panel-correct {
        border-color: var(--correct);
      }
      .reveal-panel.panel-wrong {
        border-color: var(--wrong);
      }
      .reveal-result {
        font-size: clamp(1.3rem, 3.4vw, 1.9rem);
        margin-bottom: 16px;
      }
      .panel-correct .reveal-result {
        color: var(--correct-dark);
      }
      .panel-wrong .reveal-result {
        color: var(--wrong-dark);
      }
      .continue-btn {
        font-family: inherit;
        font-size: clamp(1rem, 2.4vw, 1.3rem);
        padding: 14px 26px;
        border-radius: 18px;
        border: none;
        background: var(--fire);
        color: #fff;
        cursor: pointer;
        box-shadow: 0 6px 0 var(--fire-dark);
      }
      .continue-btn:hover {
        transform: translateY(-2px);
      }
      .continue-btn:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 var(--fire-dark);
      }

      @keyframes pop {
        0% {
          transform: scale(0.6);
        }
        60% {
          transform: scale(1.08);
        }
        100% {
          transform: scale(1);
        }
      }

      /* ---------- 결과 화면 ---------- */
      .result-card {
        background: var(--cream);
        border: 6px solid var(--wood);
        border-radius: 28px;
        padding: clamp(24px, 5vw, 44px);
        width: min(480px, 90vw);
        text-align: center;
        box-shadow:
          0 14px 0 rgba(0, 0, 0, 0.15),
          inset 0 0 0 3px rgba(255, 255, 255, 0.6);
        margin-bottom: 20px;
      }
      #resultTeam {
        font-size: clamp(1.3rem, 3vw, 1.7rem);
        margin-bottom: 8px;
      }
      #resultScore {
        font-size: clamp(1.8rem, 5vw, 2.6rem);
        margin-bottom: 10px;
        color: var(--tent-dark);
      }
      #resultDetail {
        font-size: clamp(1rem, 2.2vw, 1.2rem);
        color: var(--ink);
      }
      .result-buttons {
        display: flex;
        gap: 14px;
        margin-bottom: 22px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .leaderboard {
        background: var(--cream);
        border: 4px solid var(--wood);
        border-radius: 20px;
        padding: 18px 22px;
        width: min(480px, 90vw);
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15);
      }
      .lb-title {
        font-size: clamp(1.1rem, 2.6vw, 1.3rem);
        margin-bottom: 10px;
        text-align: center;
      }
      .lb-row {
        display: flex;
        justify-content: space-between;
        font-size: clamp(0.9rem, 2vw, 1.05rem);
        padding: 6px 4px;
        border-bottom: 2px dashed var(--wood);
      }
      .lb-row:last-child {
        border-bottom: none;
      }

      /* 홈 버튼 = 텐트 */
      .home-button {
        position: fixed;
        bottom: 24px;
        left: 24px;
        width: 68px;
        height: 68px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        background: var(--cream);
        border: 4px solid var(--wood);
        border-radius: 20px;
        cursor: pointer;
        text-decoration: none;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.15);
        transition: transform 0.12s ease;
        z-index: 3;
      }
      .home-button:hover {
        transform: translateY(-3px) rotate(-4deg);
      }

      @media (prefers-reduced-motion: reduce) {
        .reveal-panel,
        .start-card,
        .star {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <span class="star">⭐️</span>
      <span class="star">✨</span>
      <span class="star">⭐️</span>
      <span class="star">✨</span>
      <span class="star">🌙</span>
      <span class="star">⭐️</span>

      <!-- 팀 이름 / 문제 수 화면 (제일 처음) -->
      <section id="start-screen" class="screen">
        <h1 class="title">🎬 영화 명대사 퀴즈</h1>
        <div class="start-card">
          <label class="field-label" for="teamNameInput">팀 이름</label>
          <input
            id="teamNameInput"
            class="team-input"
            type="text"
            placeholder="예: 1팀"
            maxlength="14"
          />
          <p class="field-label">몇 문제에 도전할까요?</p>
          <div class="count-buttons">
            <button class="count-btn" onclick="startGame(8)">8문제</button>
            <button class="count-btn" onclick="startGame(10)">10문제</button>
          </div>
          <p class="pool-note" id="poolNote"></p>
        </div>
      </section>

      <!-- 게임 화면 -->
      <section id="game-screen" class="screen hidden">
        <div class="hud">
          <span id="teamLabel"></span>
          <span id="progressLabel"></span>
          <span id="scoreLabel"></span>
        </div>

        <div class="image-container">
          <img id="quiz-image" src="" alt="퀴즈 이미지" />
          <p id="stageLabel" class="stage-label"></p>
        </div>

        <!-- 문제 단계: O/X 버튼 -->
        <div class="game-controls">
          <button
            id="btnCorrect"
            class="side-btn correct-btn"
            onclick="answer(true)"
          >
            ⚪️
          </button>
          <button
            id="btnWrong"
            class="side-btn wrong-btn"
            onclick="answer(false)"
          >
            ❌
          </button>
        </div>

        <!-- 정답 단계: 판정 + 다음 -->
        <div id="reveal-panel" class="reveal-panel hidden">
          <p id="reveal-result" class="reveal-result"></p>
          <button id="continueBtn" class="continue-btn"></button>
        </div>
      </section>

      <!-- 결과 화면 -->
      <section id="result-screen" class="screen hidden">
        <h1 class="title">🏁 결과</h1>
        <div class="result-card">
          <p id="resultTeam"></p>
          <p id="resultScore"></p>
          <p id="resultDetail"></p>
        </div>
        <div class="result-buttons">
          <button class="count-btn" onclick="nextTeam()">다른 팀 ▶</button>
          <button class="count-btn" onclick="resetAll()">처음부터</button>
        </div>
        <div id="leaderboard" class="leaderboard"></div>
      </section>

      <a href="start.html" class="home-button">⛺️</a>
    </div>

    <script>
      // 슬라이드: 홀수=문제, 짝수=정답. slide_01 ~ slide_48 (총 24문제)
      const totalSlides = 48;

      // 슬라이드 번호를 slide_01.png 형태 경로로
      function slidePath(n) {
        const num = String(n).padStart(2, "0");
        return `images/slide_${num}.png`;
      }

      // 문제 쌍 만들기: { q: 홀수경로, a: 짝수경로, id: 문제번호 }
      function buildFullPool() {
        const pool = [];
        for (let n = 1; n + 1 <= totalSlides; n += 2) {
          pool.push({
            id: Math.ceil(n / 2), // 1,2,3...24
            q: slidePath(n), // 문제 (홀수)
            a: slidePath(n + 1), // 정답 (짝수)
          });
        }
        return pool;
      }

      let quizPool = [];
      let currentIndex = 0;
      let score = 0;
      let teamName = "참가팀";
      let leaderboard = [];

      // 세션 동안 남은 문제 풀 (팀 간 중복 방지)
      let remainingPool = [];

      const $ = (id) => document.getElementById(id);

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function refillPool() {
        remainingPool = shuffle(buildFullPool());
      }

      function drawQuestions(count) {
        // 남은 게 부족하면 재사용(다시 섞어 채우기)
        if (remainingPool.length < count) {
          refillPool();
        }
        // 풀에서 제거하지 않고 앞에서 count개만 미리 보기
        return remainingPool.slice(0, count);
      }

      function updatePoolNote() {
        const note = $("poolNote");
        if (!note) return;
        note.textContent = `남은 문제 ${remainingPool.length}개`;
      }

      function showScreen(id) {
        document
          .querySelectorAll(".screen")
          .forEach((s) => s.classList.add("hidden"));
        $(id).classList.remove("hidden");
        if (id === "start-screen") updatePoolNote();
      }

      function startGame(count) {
        const inputVal = $("teamNameInput").value.trim();
        teamName = inputVal || "참가팀";
        quizPool = drawQuestions(count);
        currentIndex = 0;
        score = 0;
        showScreen("game-screen");
        renderQuestion();
      }

      // 문제 단계: 홀수(문제) 이미지 + O/X 버튼
      function renderQuestion() {
        $("reveal-panel").classList.add("hidden");
        $("reveal-panel").classList.remove("panel-correct", "panel-wrong");
        $("btnCorrect").classList.remove("hidden");
        $("btnWrong").classList.remove("hidden");

        const img = $("quiz-image");
        img.classList.remove("is-answer");
        img.src = quizPool[currentIndex].q;

        $("stageLabel").textContent = "명대사를 맞혀보세요! 🎬";
        $("teamLabel").textContent = `👥 ${teamName}`;
        $("progressLabel").textContent =
          `문제 ${currentIndex + 1} / ${quizPool.length}`;
        $("scoreLabel").textContent = `정답 ${score}개`;
      }

      // O/X 누름 -> 정답(짝수) 이미지 공개 + 판정
      function answer(isCorrect) {
        $("btnCorrect").classList.add("hidden");
        $("btnWrong").classList.add("hidden");

        // 정답 이미지로 교체
        const img = $("quiz-image");
        img.classList.add("is-answer");
        img.src = quizPool[currentIndex].a;

        const panel = $("reveal-panel");
        panel.classList.remove("hidden");
        panel.classList.toggle("panel-correct", isCorrect);
        panel.classList.toggle("panel-wrong", !isCorrect);
        $("reveal-result").textContent = isCorrect ? "정답! 🎉" : "땡! 😢";

        if (isCorrect) {
          score++;
          $("scoreLabel").textContent = `정답 ${score}개`;
        }

        const isLast = currentIndex === quizPool.length - 1;
        const btn = $("continueBtn");
        if (!isLast) {
          btn.textContent = "다음 문제 ▶";
          btn.onclick = nextQuestion;
        } else {
          btn.textContent = "결과 보기 🏁";
          btn.onclick = finishGame;
        }
      }

      function nextQuestion() {
        currentIndex++;
        renderQuestion();
      }

      function finishGame() {
        const attempted = currentIndex + 1; // 실제로 나온(답한) 문제 수
        const total = quizPool.length;
        const stoppedEarly = attempted < total;

        // 실제로 나온 문제만 풀에서 제거 (안 나온 건 그대로 남음)
        const usedIds = new Set(quizPool.slice(0, attempted).map((q) => q.id));
        remainingPool = remainingPool.filter((p) => !usedIds.has(p.id));

        leaderboard.unshift({
          name: teamName,
          score,
          attempted,
          total,
          stoppedEarly,
        });

        $("resultTeam").textContent = teamName;
        $("resultScore").textContent = `${score}문제 정답`;

        renderLeaderboard();
        showScreen("result-screen");
      }

      function renderLeaderboard() {
        const el = $("leaderboard");
        if (leaderboard.length === 0) {
          el.innerHTML = "";
          return;
        }
        const rows = leaderboard
          .slice()
          .sort((a, b) => b.score - a.score)
          .map(
            (r, idx) =>
              `<div class="lb-row"><span>${idx + 1}. ${escapeHtml(r.name)}</span><span>${r.score} ${r.stoppedEarly ? " (탈락)" : ""}</span></div>`,
          )
          .join("");
        el.innerHTML = `<h3 class="lb-title">🏆 팀별 기록</h3>${rows}`;
      }

      // 다른 팀: 남은 풀 유지(중복 제외), 기록 유지, 팀 이름만 새로
      function nextTeam() {
        showScreen("start-screen");
        $("teamNameInput").value = "";
        $("teamNameInput").focus();
      }

      // 처음부터: 모두 초기화
      function resetAll() {
        refillPool();
        leaderboard = [];
        renderLeaderboard();
        score = 0;
        currentIndex = 0;
        teamName = "참가팀";
        $("teamNameInput").value = "";
        showScreen("start-screen");
      }

      // 최초 로드 시 문제 풀 준비
      refillPool();
    </script>
  </body>
</html>
