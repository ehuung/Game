<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="theme.css" />
    <style>
      .image-container {
        z-index: 2;
        text-align: center;
      }
      .image-container img {
        width: min(760px, 88vw);
        max-height: 62vh;
        object-fit: contain;
        height: auto;
        background: var(--cream);
        border: 8px solid var(--wood);
        border-radius: 28px;
        box-shadow: 0 14px 0 rgba(0, 0, 0, 0.18);
        display: block;
      }
      /* 정답 이미지일 때 테두리 색 */
      .image-container img.is-answer {
        border-color: var(--correct);
      }
      .stage-label {
        margin-top: 14px;
        font-size: clamp(1.1rem, 3vw, 1.5rem);
        color: var(--cream);
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
      }

      /* 정답 단계: 왼쪽 판정 (O/X 자리) */
      .side-verdict {
        position: fixed;
        left: clamp(12px, 4vw, 48px);
        top: 50%;
        transform: translateY(-50%);
        z-index: 3;
        text-align: center;
        font-size: clamp(1.6rem, 4.5vw, 2.6rem);
        padding: 20px 26px;
        border-radius: 24px;
        background: var(--cream);
        border: 5px solid var(--wood);
        box-shadow: 0 8px 0 rgba(0, 0, 0, 0.15);
        animation: pop 0.4s cubic-bezier(0.22, 1.4, 0.4, 1);
      }
      .side-verdict.is-correct {
        border-color: var(--correct);
        color: var(--correct-dark);
      }
      .side-verdict.is-wrong {
        border-color: var(--wrong);
        color: var(--wrong-dark);
      }
      .side-verdict.hidden {
        display: none;
      }

      /* 정답 단계: 오른쪽 다음/결과 버튼 (X 자리) */
      .side-continue {
        position: fixed;
        right: clamp(12px, 4vw, 48px);
        top: 50%;
        transform: translateY(-50%);
        z-index: 3;
        font-family: inherit;
        font-size: clamp(1.1rem, 3vw, 1.6rem);
        padding: 22px 28px;
        border-radius: 24px;
        border: none;
        background: var(--fire);
        color: #fff;
        cursor: pointer;
        box-shadow: 0 8px 0 var(--fire-dark);
        transition:
          transform 0.08s ease,
          box-shadow 0.08s ease;
        animation: pop 0.4s cubic-bezier(0.22, 1.4, 0.4, 1);
      }
      .side-continue:hover {
        transform: translateY(calc(-50% - 2px));
      }
      .side-continue:active {
        transform: translateY(calc(-50% + 5px));
        box-shadow: 0 3px 0 var(--fire-dark);
      }
      .side-continue.hidden {
        display: none;
      }

      @media (max-width: 700px) {
        .side-btn {
          position: static;
          transform: none;
          margin: 18px 10px 0;
        }
        .side-btn:hover,
        .side-btn:active {
          transform: none;
        }
        .game-controls {
          display: flex;
          justify-content: center;
        }
        /* 좁은 화면: 판정/다음도 아래쪽 가운데로 */
        .side-verdict {
          position: static;
          transform: none;
          display: inline-block;
          margin: 16px 8px 0;
        }
        .side-continue {
          position: static;
          transform: none;
          margin: 16px 8px 0;
        }
        .side-continue:hover,
        .side-continue:active {
          transform: none;
        }
      }

      /* ===== 가로모드: 화면이 낮고 넓을 때 압축 ===== */
      @media (orientation: landscape) and (max-height: 600px) {
        /* 게임 화면 요소 압축 */
        .word-display {
          font-size: clamp(2.2rem, 16vh, 5rem);
          padding: clamp(20px, 5vh, 44px) clamp(28px, 6vw, 60px);
          margin-bottom: 16px;
          border-radius: 24px;
        }
        .image-container img {
          max-height: 60vh;
        }
        .image-hidden {
          min-height: 34vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <span class="star">⭐️</span>
      <span class="star">✨</span>
      <span class="star">⭐️</span>
      <span class="star">✨</span>
      <span class="star">🌙</span>
      <span class="star">⭐️</span>

      <!-- 팀 이름 / 문제 수 화면 (제일 처음) -->
      <section id="start-screen" class="screen">
        <h1 class="title">🎬 영화 명대사 퀴즈</h1>
        <div class="start-card">
          <label class="field-label" for="teamNameInput">팀 이름</label>
          <input
            id="teamNameInput"
            class="team-input"
            type="text"
            placeholder="예: 1팀"
            maxlength="14"
          />
          <p class="field-label">몇 문제에 도전할까요?</p>
          <div class="count-buttons">
            <button class="count-btn" onclick="startGame(8)">8문제</button>
            <button class="count-btn" onclick="startGame(10)">10문제</button>
          </div>
          <p class="pool-note" id="poolNote"></p>
        </div>
      </section>

      <!-- 게임 화면 -->
      <section id="game-screen" class="screen hidden">
        <div class="hud">
          <span id="teamLabel"></span>
          <span id="progressLabel"></span>
          <span id="scoreLabel"></span>
        </div>

        <div class="image-container">
          <img id="quiz-image" src="" alt="퀴즈 이미지" />
          <p id="stageLabel" class="stage-label"></p>
        </div>

        <!-- 문제 단계: O/X 버튼 (이미지 양옆) -->
        <div class="game-controls">
          <button
            id="btnCorrect"
            class="side-btn correct-btn"
            onclick="answer(true)"
          >
            ⚪️
          </button>
          <button
            id="btnWrong"
            class="side-btn wrong-btn"
            onclick="answer(false)"
          >
            ❌
          </button>
        </div>

        <!-- 정답 단계: 왼쪽 판정 / 오른쪽 다음 버튼 (이미지 양옆) -->
        <div id="verdict" class="side-verdict hidden">
          <span id="verdictText"></span>
        </div>
        <button id="continueBtn" class="side-continue hidden"></button>
      </section>

      <!-- 결과 화면 -->
      <section id="result-screen" class="screen hidden">
        <h1 class="title">🏁 결과</h1>
        <div class="result-card">
          <p id="resultTeam"></p>
          <p id="resultScore"></p>
          <p id="resultDetail"></p>
        </div>
        <div class="result-buttons">
          <button class="count-btn" onclick="nextTeam()">다른 팀 ▶</button>
          <button class="count-btn" onclick="resetAll()">처음부터</button>
        </div>
        <div id="leaderboard" class="leaderboard"></div>
      </section>

      <a href="start.html" class="home-button">⛺️</a>
    </div>

    <script>
      // 슬라이드: 홀수=문제, 짝수=정답. slide_01 ~ slide_48 (총 24문제)
      const totalSlides = 48;

      // 슬라이드 번호를 slide_01.png 형태 경로로
      function slidePath(n) {
        const num = String(n).padStart(2, "0");
        return `images/slide_${num}.png`;
      }

      // 문제 쌍 만들기: { q: 홀수경로, a: 짝수경로, id: 문제번호 }
      function buildFullPool() {
        const pool = [];
        for (let n = 1; n + 1 <= totalSlides; n += 2) {
          pool.push({
            id: Math.ceil(n / 2), // 1,2,3...24
            q: slidePath(n), // 문제 (홀수)
            a: slidePath(n + 1), // 정답 (짝수)
          });
        }
        return pool;
      }

      let quizPool = [];
      let currentIndex = 0;
      let score = 0;
      let teamName = "참가팀";
      let leaderboard = [];

      // 세션 동안 남은 문제 풀 (팀 간 중복 방지)
      let remainingPool = [];

      const $ = (id) => document.getElementById(id);

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function refillPool() {
        remainingPool = shuffle(buildFullPool());
      }

      function drawQuestions(count) {
        // 남은 게 부족하면 재사용(다시 섞어 채우기)
        if (remainingPool.length < count) {
          refillPool();
        }
        // 풀에서 제거하지 않고 앞에서 count개만 미리 보기
        return remainingPool.slice(0, count);
      }

      function updatePoolNote() {
        const note = $("poolNote");
        if (!note) return;
        note.textContent = `남은 문제 ${remainingPool.length}개`;
      }

      function showScreen(id) {
        document
          .querySelectorAll(".screen")
          .forEach((s) => s.classList.add("hidden"));
        $(id).classList.remove("hidden");
        if (id === "start-screen") updatePoolNote();
      }

      function startGame(count) {
        const inputVal = $("teamNameInput").value.trim();
        teamName = inputVal || "참가팀";
        quizPool = drawQuestions(count);
        currentIndex = 0;
        score = 0;
        showScreen("game-screen");
        renderQuestion();
      }

      // 문제 단계: 홀수(문제) 이미지 + O/X 버튼
      function renderQuestion() {
        // 정답 단계 요소 숨기고, 문제 단계(O/X) 복귀
        $("verdict").classList.add("hidden");
        $("continueBtn").classList.add("hidden");
        $("btnCorrect").classList.remove("hidden");
        $("btnWrong").classList.remove("hidden");

        const img = $("quiz-image");
        img.classList.remove("is-answer");
        img.src = quizPool[currentIndex].q;

        $("teamLabel").textContent = `👥 ${teamName}`;
        $("progressLabel").textContent =
          `문제 ${currentIndex + 1} / ${quizPool.length}`;
        $("scoreLabel").textContent = `정답 ${score}개`;
      }

      // O/X 누름 -> 정답(짝수) 이미지 공개 + 좌우 판정/버튼
      function answer(isCorrect) {
        // O/X 버튼 숨기기
        $("btnCorrect").classList.add("hidden");
        $("btnWrong").classList.add("hidden");

        // 정답 이미지로 교체
        const img = $("quiz-image");
        img.classList.add("is-answer");
        img.src = quizPool[currentIndex].a;

        // 왼쪽: 판정 (땡! / 정답!)
        const verdict = $("verdict");
        verdict.classList.remove("hidden", "is-correct", "is-wrong");
        verdict.classList.add(isCorrect ? "is-correct" : "is-wrong");
        $("verdictText").textContent = isCorrect ? "정답! 🎉" : "땡! 😢";

        if (isCorrect) {
          score++;
          $("scoreLabel").textContent = `정답 ${score}개`;
        }

        // 오른쪽: 다음 버튼
        // - 맞으면: 다음 문제 (마지막이면 결과 보기)
        // - 틀리면: 바로 결과 보기 (그 팀은 여기서 끝)
        const isLast = currentIndex === quizPool.length - 1;
        const btn = $("continueBtn");
        btn.classList.remove("hidden");
        if (isCorrect && !isLast) {
          btn.textContent = "다음 문제 ▶";
          btn.onclick = nextQuestion;
        } else {
          btn.textContent = "결과 보기 🏁";
          btn.onclick = finishGame;
        }
      }

      function nextQuestion() {
        currentIndex++;
        renderQuestion();
      }

      function finishGame() {
        const attempted = currentIndex + 1; // 실제로 나온(답한) 문제 수
        const total = quizPool.length;
        const stoppedEarly = attempted < total;

        // 실제로 나온 문제만 풀에서 제거 (안 나온 건 그대로 남음)
        const usedIds = new Set(quizPool.slice(0, attempted).map((q) => q.id));
        remainingPool = remainingPool.filter((p) => !usedIds.has(p.id));

        leaderboard.unshift({
          name: teamName,
          score,
          attempted,
          total,
          stoppedEarly,
        });

        $("resultTeam").textContent = teamName;
        $("resultScore").textContent = `${score}문제 정답`;

        renderLeaderboard();
        showScreen("result-screen");
      }

      function renderLeaderboard() {
        const el = $("leaderboard");
        if (leaderboard.length === 0) {
          el.innerHTML = "";
          return;
        }
        const rows = leaderboard
          .slice()
          .sort((a, b) => b.score - a.score)
          .map(
            (r, idx) =>
              `<div class="lb-row"><span>${idx + 1}. ${escapeHtml(r.name)}</span><span>${r.score} ${r.stoppedEarly ? " (탈락)" : ""}</span></div>`,
          )
          .join("");
        el.innerHTML = `<h3 class="lb-title">🏆 팀별 기록</h3>${rows}`;
      }

      // 다른 팀: 남은 풀 유지(중복 제외), 기록 유지, 팀 이름만 새로
      function nextTeam() {
        showScreen("start-screen");
        $("teamNameInput").value = "";
        $("teamNameInput").focus();
      }

      // 처음부터: 모두 초기화
      function resetAll() {
        refillPool();
        leaderboard = [];
        renderLeaderboard();
        score = 0;
        currentIndex = 0;
        teamName = "참가팀";
        $("teamNameInput").value = "";
        showScreen("start-screen");
      }

      // 최초 로드 시 문제 풀 준비
      refillPool();
    </script>
  </body>
</html>
