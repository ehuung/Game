<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="theme.css" />
    <style>
      /* 타이머 라벨: 초읽기 들어가면 강조 */
      #timerLabel {
        color: var(--fire-dark);
      }
      #timerLabel.urgent {
        color: var(--wrong-dark);
        animation: tick 0.6s ease-in-out infinite;
      }
      @keyframes tick {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.18);
        }
      }

      .image-container {
        z-index: 2;
      }
      .image-container img {
        width: min(680px, 82vw);
        max-height: 58vh;
        object-fit: contain;
        height: auto;
        background: var(--cream);
        border: 8px solid var(--wood);
        border-radius: 28px;
        box-shadow: 0 14px 0 rgba(0, 0, 0, 0.18);
        display: block;
      }
      #quiz-image.hidden {
        display: none;
      }

      /* 이미지가 사라졌을 때 보여줄 자리 */
      .image-hidden {
        width: min(680px, 82vw);
        min-height: 40vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
        font-size: clamp(1.4rem, 4vw, 2rem);
        color: var(--ink);
        background: var(--cream);
        border: 8px dashed var(--wood);
        border-radius: 28px;
        box-shadow: 0 14px 0 rgba(0, 0, 0, 0.18);
        animation: pop 0.35s cubic-bezier(0.22, 1.4, 0.4, 1);
      }
      .image-hidden .big-q {
        font-size: clamp(3rem, 10vw, 5rem);
      }
      .image-hidden.hidden {
        display: none;
      }

      @media (max-width: 700px) {
        .side-btn {
          position: static;
          transform: none;
          margin: 18px 10px 0;
        }
        .side-btn:hover,
        .side-btn:active {
          transform: none;
        }
        .game-controls {
          display: flex;
          justify-content: center;
        }
      }

      /* ===== 가로모드: 화면이 낮고 넓을 때 압축 ===== */
      @media (orientation: landscape) and (max-height: 600px) {
        .word-display {
          font-size: clamp(2.2rem, 16vh, 5rem);
          padding: clamp(20px, 5vh, 44px) clamp(28px, 6vw, 60px);
          margin-bottom: 16px;
          border-radius: 24px;
        }
        .image-container img {
          max-height: 60vh;
        }
        .image-hidden {
          min-height: 34vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <span class="star">⭐️</span>
      <span class="star">✨</span>
      <span class="star">⭐️</span>
      <span class="star">✨</span>
      <span class="star">🌙</span>
      <span class="star">⭐️</span>

      <!-- 시간 선택 화면 (제일 처음) -->
      <section id="time-screen" class="screen">
        <h1 class="title">⏱</h1>
        <div class="start-card">
          <div class="count-buttons">
            <button class="count-btn" onclick="selectTime(3)">3초</button>
            <button class="count-btn" onclick="selectTime(5)">5초</button>
            <button class="count-btn" onclick="selectTime(0)">무제한</button>
          </div>
        </div>
      </section>

      <!-- 팀 이름 / 문제 수 화면 -->
      <section id="start-screen" class="screen hidden">
        <h1 class="title">🙄 내가 누구게 ?</h1>
        <div class="start-card">
          <label class="field-label" for="teamNameInput">팀 이름</label>
          <input
            id="teamNameInput"
            class="team-input"
            type="text"
            placeholder="예: 1팀"
            maxlength="14"
          />
          <p class="field-label">몇 문제에 도전할까요?</p>
          <div class="count-buttons">
            <button class="count-btn" onclick="startGame(8)">8문제</button>
            <button class="count-btn" onclick="startGame(10)">10문제</button>
          </div>
          <p class="pool-note" id="poolNote"></p>
        </div>
      </section>

      <!-- 게임 화면 -->
      <section id="game-screen" class="screen hidden">
        <div class="hud">
          <span id="teamLabel"></span>
          <span id="progressLabel"></span>
          <span id="scoreLabel"></span>
          <span id="timerLabel"></span>
        </div>

        <div class="image-container">
          <img id="quiz-image" src="" alt="퀴즈 이미지" />
          <div id="image-hidden" class="image-hidden hidden">
            <span class="big-q">🤔</span>
            <span>누구게 ~?</span>
          </div>
        </div>

        <div class="game-controls">
          <button
            id="btnCorrect"
            class="side-btn correct-btn"
            onclick="answer(true)"
          >
            ⚪️
          </button>
          <button
            id="btnWrong"
            class="side-btn wrong-btn"
            onclick="answer(false)"
          >
            ❌
          </button>
        </div>

        <div id="reveal-panel" class="reveal-panel hidden">
          <p id="reveal-result" class="reveal-result"></p>
          <p id="reveal-name" class="reveal-name"></p>
          <button id="continueBtn" class="continue-btn"></button>
        </div>
      </section>

      <!-- 결과 화면 -->
      <section id="result-screen" class="screen hidden">
        <h1 class="title">🏁 결과</h1>
        <div class="result-card">
          <p id="resultTeam"></p>
          <p id="resultScore"></p>
          <p id="resultDetail"></p>
        </div>
        <div class="result-buttons">
          <button class="count-btn" onclick="nextTeam()">다른 팀 ▶</button>
          <button class="count-btn" onclick="resetAll()">처음부터</button>
        </div>
        <div id="leaderboard" class="leaderboard"></div>
      </section>

      <a href="start.html" class="home-button">⛺️</a>
    </div>

    <script>
      const totalImages = 50; // 전체 이미지 개수
      const imageTexts = [
        "원이",
        "김민재",
        "곽범",
        "도라에몽",
        "이수근",
        "김해준",
        "앤 해서웨이",
        "나문희",
        "유재석",
        "호날두",
        "이유진",
        "세종대왕",
        "미나미",
        "코요태",
        "미달이",
        "마이클잭슨",
        "페이커",
        "도날드 트럼프",
        "두부",
        "지드래곤",
        "차범근",
        "김연아",
        "박준형",
        "거미",
        "나훈아",
        "김해수",
        "아이유",
        "도아",
        "봉준호",
        "이효리",
        "박보검",
        "이병헌",
        "김희진",
        "싸이",
        "웨렌 버핏",
        "추성훈",
        "안세영",
        "최민식",
        "김태리",
        "곽튜브",
        "제니",
        "추영우",
        "마크 저커버그",
        "방탄소년단",
        "신동엽",
        "코난",
        "김우빈",
        "최산",
        "윈터",
        "태연",
      ];

      let quizPool = [];
      let currentIndex = 0;
      let score = 0;
      let teamName = "참가팀";
      let leaderboard = []; // 세션 동안 쌓이는 팀별 기록

      // 세션 동안 남은 인물 풀 (팀 간 중복 방지). 소진되면 다시 채움.
      let remainingPool = [];

      // 시간 제한 관련 (0 = 무제한)
      let timeLimit = 0;
      let timerId = null;
      let remaining = 0;

      const $ = (id) => document.getElementById(id);

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function buildFullPool() {
        const pool = [];
        for (let i = 0; i < totalImages; i++) {
          pool.push({ img: `images/${i + 1}.png`, name: imageTexts[i] });
        }
        return pool;
      }

      // 인물 풀 전체 초기화 (새로 섞기)
      function refillPool() {
        remainingPool = shuffle(buildFullPool());
      }

      // 남은 풀에서 count개 꺼내기 (꺼낸 건 풀에서 제거 -> 다음 팀엔 안 나옴)
      // 남은 게 부족하면 재사용(다시 섞어 채우기). 재사용 시에도 이번 판 안에서는 중복 없음.
      function drawQuestions(count) {
        let drawn = [];
        if (remainingPool.length < count) {
          // 남은 것 먼저 다 꺼내고
          drawn = remainingPool.splice(0, remainingPool.length);
          // 풀 다시 채우기 (재사용)
          refillPool();
          // 방금 꺼낸 인물과 겹치지 않게 나머지 채우기
          const used = new Set(drawn.map((d) => d.name));
          while (drawn.length < count && remainingPool.length > 0) {
            const idx = remainingPool.findIndex((item) => !used.has(item.name));
            if (idx === -1) break;
            const picked = remainingPool.splice(idx, 1)[0];
            drawn.push(picked);
            used.add(picked.name);
          }
        } else {
          drawn = remainingPool.splice(0, count);
        }
        return drawn;
      }

      function updatePoolNote() {
        const note = $("poolNote");
        if (!note) return;
        note.textContent = `남은 인물 ${remainingPool.length}명`;
      }

      function showScreen(id) {
        document
          .querySelectorAll(".screen")
          .forEach((s) => s.classList.add("hidden"));
        $(id).classList.remove("hidden");
        if (id === "start-screen") updatePoolNote();
      }

      // 1단계: 시간 선택 -> 팀 이름 화면으로
      function selectTime(sec) {
        timeLimit = sec;
        showScreen("start-screen");
      }

      // ----- 타이머 -----
      function clearTimer() {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
      }

      function updateTimerLabel() {
        const label = $("timerLabel");
        if (!timeLimit) {
          label.textContent = "⏱ 무제한";
          label.classList.remove("urgent");
          return;
        }
        label.textContent = `⏱ ${remaining}초`;
        label.classList.toggle("urgent", remaining <= 2);
      }

      function hideImage() {
        $("quiz-image").classList.add("hidden");
        $("image-hidden").classList.remove("hidden");
      }

      function startTimer() {
        clearTimer();
        if (!timeLimit) {
          // 무제한: 이미지 계속 표시
          updateTimerLabel();
          return;
        }
        remaining = timeLimit;
        updateTimerLabel();
        timerId = setInterval(() => {
          remaining--;
          if (remaining <= 0) {
            remaining = 0;
            updateTimerLabel();
            hideImage(); // 시간 끝 -> 이미지 사라짐
            clearTimer();
          } else {
            updateTimerLabel();
          }
        }, 1000);
      }

      // 2단계: 게임 시작
      function startGame(count) {
        const inputVal = $("teamNameInput").value.trim();
        teamName = inputVal || "참가팀";
        quizPool = drawQuestions(count); // 중복 제외하고 뽑기
        currentIndex = 0;
        score = 0;
        showScreen("game-screen");
        renderQuestion();
      }

      function renderQuestion() {
        clearTimer();
        $("reveal-panel").classList.add("hidden");
        $("reveal-panel").classList.remove("panel-correct", "panel-wrong");
        $("btnCorrect").classList.remove("hidden");
        $("btnWrong").classList.remove("hidden");
        document.querySelector(".image-container").style.display = ""; // ← 추가
        // 이미지 다시 보이게, 사라짐 자리 숨김
        $("quiz-image").classList.remove("hidden");
        $("image-hidden").classList.add("hidden");
        $("quiz-image").src = quizPool[currentIndex].img;

        $("teamLabel").textContent = `👥 ${teamName}`;
        $("progressLabel").textContent =
          `문제 ${currentIndex + 1} / ${quizPool.length}`;
        $("scoreLabel").textContent = `정답 ${score}개`;

        startTimer(); // 이미지 노출 타이머 시작
      }

      function answer(isCorrect) {
        clearTimer(); // O/X 누르면 타이머 정지
        $("timerLabel").classList.remove("urgent");

        $("btnCorrect").classList.add("hidden");
        $("btnWrong").classList.add("hidden");
        document.querySelector(".image-container").style.display = "none"; // ← 추가

        const panel = $("reveal-panel");
        panel.classList.remove("hidden");
        panel.classList.toggle("panel-correct", isCorrect);
        panel.classList.toggle("panel-wrong", !isCorrect);

        $("reveal-result").textContent = isCorrect ? "정답! 🎉" : "땡! 😢";
        $("reveal-name").textContent = quizPool[currentIndex].name;

        if (isCorrect) {
          score++;
          $("scoreLabel").textContent = `정답 ${score}개`;
        }

        const isLast = currentIndex === quizPool.length - 1;
        const btn = $("continueBtn");

        if (isCorrect && !isLast) {
          btn.textContent = "다음 문제 ▶";
          btn.onclick = nextQuestion;
        } else {
          btn.textContent = "결과 보기 🏁";
          btn.onclick = finishGame;
        }
      }

      function nextQuestion() {
        currentIndex++;
        renderQuestion();
      }

      function finishGame() {
        clearTimer();
        const attempted = currentIndex + 1;
        const total = quizPool.length;
        const stoppedEarly = attempted < total;

        leaderboard.unshift({
          name: teamName,
          score,
          attempted,
          total,
          stoppedEarly,
        });

        $("resultTeam").textContent = teamName;
        $("resultScore").textContent = `${score}문제 정답`;

        renderLeaderboard();
        showScreen("result-screen");
      }

      function renderLeaderboard() {
        const el = $("leaderboard");
        if (leaderboard.length === 0) {
          el.innerHTML = "";
          return;
        }
        const rows = leaderboard
          .slice()
          .sort((a, b) => b.score - a.score)
          .map(
            (r, idx) =>
              `<div class="lb-row"><span>${idx + 1}. ${escapeHtml(r.name)}</span><span>${r.score} ${r.stoppedEarly ? " (탈락)" : ""}</span></div>`,
          )
          .join("");
        el.innerHTML = `<h3 class="lb-title">🏆 팀별 기록</h3>${rows}`;
      }

      // 다른 팀: 남은 풀 유지(= 이전에 나온 이미지 제외), 기록 유지, 팀 이름만 새로
      function nextTeam() {
        showScreen("start-screen");
        $("teamNameInput").value = "";
        $("teamNameInput").focus();
      }

      // 처음부터: 모두 초기화 (인물 풀 전체 복구 + 기록 삭제 + 시간 선택부터)
      function resetAll() {
        clearTimer();
        refillPool(); // 인물 풀 전체 초기화
        leaderboard = []; // 기록 초기화
        renderLeaderboard();
        score = 0;
        currentIndex = 0;
        teamName = "참가팀";
        $("teamNameInput").value = "";
        showScreen("time-screen");
      }

      // 최초 로드 시 인물 풀 준비
      refillPool();
    </script>
  </body>
</html>
