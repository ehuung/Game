<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game</title>
    <link rel="icon" href="./favicon.ico" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Jua&family=Gamja+Flower&display=swap");
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        position: fixed;
        overflow: hidden;
      }

      :root {
        --sky-top: #0c1b45;
        --sky-mid: #1e3f86;
        --sky-low: #7fb2ec;
        --cream: #fbf7ee;
        --wood: #dfe7f5;
        --fire: #ff9a52;
        --fire-dark: #e2702a;
        --tent: #4a90d9;
        --tent-dark: #2f6cae;
        --star: #ffe36b;
        --ink: #2c3556;
        --correct: #58c98a;
        --correct-dark: #379966;
        --wrong: #ff5c6c;
        --wrong-dark: #d63c4c;
      }

      body {
        font-family: "Jua", sans-serif;
        color: var(--ink);
        /* 모바일에서 화면이 스크롤로 붕 뜨는 것 방지 */
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
      }

      .container {
        background: linear-gradient(
          160deg,
          var(--sky-top) 0%,
          var(--sky-mid) 55%,
          var(--sky-low) 100%
        );
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        position: relative;
        padding: 24px;
      }

      /* 반짝이는 별들 */
      .star {
        position: fixed;
        color: var(--star);
        opacity: 0.9;
        animation: twinkle 2.4s ease-in-out infinite;
        pointer-events: none;
        user-select: none;
        z-index: 1;
      }
      .star:nth-child(1) {
        top: 10%;
        left: 12%;
        font-size: 1.4rem;
        animation-delay: 0s;
      }
      .star:nth-child(2) {
        top: 20%;
        left: 80%;
        font-size: 1rem;
        animation-delay: 0.6s;
      }
      .star:nth-child(3) {
        top: 7%;
        left: 55%;
        font-size: 0.9rem;
        animation-delay: 1.1s;
      }
      .star:nth-child(4) {
        top: 28%;
        left: 30%;
        font-size: 1.2rem;
        animation-delay: 1.6s;
      }
      .star:nth-child(5) {
        top: 14%;
        left: 90%;
        font-size: 0.8rem;
        animation-delay: 0.3s;
      }
      .star:nth-child(6) {
        top: 38%;
        left: 6%;
        font-size: 1rem;
        animation-delay: 2s;
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.25;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1.15);
        }
      }

      /* 상단 타이틀 */
      .title {
        color: var(--cream);
        font-family: "Jua", sans-serif;
        font-size: clamp(2rem, 6vw, 3.4rem);
        letter-spacing: 2px;
        margin-bottom: 24px;
        text-shadow: 0 3px 0 rgba(0, 0, 0, 0.18);
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 2;
      }

      .screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 2;
        width: 100%;
        /* 화면 꽉 채우고 기본은 스크롤 잠금 (결과 화면만 아래에서 허용) */
        height: 100%;
        justify-content: center;
        overflow: hidden;
      }
      .screen.hidden {
        display: none;
      }
      /* 결과 화면만: 기록이 길어지면 스크롤 허용 */
      #result-screen {
        justify-content: flex-start;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        padding-top: 24px;
        padding-bottom: 40px;
      }

      /* ---------- 시작 / 시간 선택 화면 ---------- */
      .start-card {
        background: var(--cream);
        border: 6px solid var(--wood);
        border-radius: 32px;
        padding: clamp(32px, 6vw, 56px);
        width: min(480px, 90vw);
        text-align: center;
        box-shadow:
          0 14px 0 rgba(0, 0, 0, 0.15),
          inset 0 0 0 3px rgba(255, 255, 255, 0.6);
        animation: pop 0.45s cubic-bezier(0.22, 1.4, 0.4, 1);
      }
      .field-label {
        font-size: clamp(1rem, 2.4vw, 1.3rem);
        margin-bottom: 12px;
        color: var(--ink);
      }
      .team-input {
        width: 100%;
        font-family: "Jua", sans-serif;
        font-size: clamp(1.1rem, 2.6vw, 1.4rem);
        padding: 14px 16px;
        border-radius: 16px;
        border: 4px solid var(--wood);
        text-align: center;
        margin-bottom: 28px;
        background: #fff;
        color: var(--ink);
      }
      .team-input:focus {
        outline: none;
        border-color: var(--tent);
      }
      .count-buttons {
        display: flex;
        gap: 16px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .count-btn {
        font-family: inherit;
        font-size: clamp(1.1rem, 2.6vw, 1.4rem);
        padding: 18px 28px;
        border-radius: 20px;
        border: none;
        background: var(--tent);
        color: #fff;
        cursor: pointer;
        box-shadow: 0 7px 0 var(--tent-dark);
        transition:
          transform 0.08s ease,
          box-shadow 0.08s ease;
      }
      .count-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 9px 0 var(--tent-dark);
      }
      .count-btn:active {
        transform: translateY(5px);
        box-shadow: 0 2px 0 var(--tent-dark);
      }

      /* 남은 인물 수 안내 */
      .pool-note {
        margin-top: 18px;
        font-size: clamp(0.85rem, 2vw, 1rem);
        color: var(--tent-dark);
      }

      /* ---------- 게임 화면 ---------- */
      .hud {
        display: flex;
        gap: clamp(10px, 3vw, 28px);
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        background: var(--cream);
        border: 4px solid var(--wood);
        border-radius: 20px;
        padding: 10px 22px;
        margin-bottom: 20px;
        font-size: clamp(0.9rem, 2vw, 1.1rem);
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15);
        z-index: 2;
      }
      /* 타이머 라벨: 초읽기 들어가면 강조 */
      #timerLabel {
        color: var(--fire-dark);
      }
      #timerLabel.urgent {
        color: var(--wrong-dark);
        animation: tick 0.6s ease-in-out infinite;
      }
      @keyframes tick {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.18);
        }
      }

      .image-container {
        z-index: 2;
      }
      .image-container img {
        width: min(680px, 82vw);
        max-height: 58vh;
        object-fit: contain;
        height: auto;
        background: var(--cream);
        border: 8px solid var(--wood);
        border-radius: 28px;
        box-shadow: 0 14px 0 rgba(0, 0, 0, 0.18);
        display: block;
      }
      #quiz-image.hidden {
        display: none;
      }

      /* 이미지가 사라졌을 때 보여줄 자리 */
      .image-hidden {
        width: min(680px, 82vw);
        min-height: 40vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
        font-size: clamp(1.4rem, 4vw, 2rem);
        color: var(--ink);
        background: var(--cream);
        border: 8px dashed var(--wood);
        border-radius: 28px;
        box-shadow: 0 14px 0 rgba(0, 0, 0, 0.18);
        animation: pop 0.35s cubic-bezier(0.22, 1.4, 0.4, 1);
      }
      .image-hidden .big-q {
        font-size: clamp(3rem, 10vw, 5rem);
      }
      .image-hidden.hidden {
        display: none;
      }

      /* O / X 버튼 - 화면 양쪽 */
      .side-btn {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        font-family: inherit;
        border-radius: 50%;
        width: clamp(64px, 10vw, 96px);
        height: clamp(64px, 10vw, 96px);
        font-size: clamp(1.8rem, 4vw, 2.6rem);
        color: #fff;
        border: none;
        cursor: pointer;
        z-index: 3;
        transition:
          transform 0.08s ease,
          box-shadow 0.08s ease;
      }
      .correct-btn {
        left: clamp(12px, 4vw, 48px);
        background: var(--correct);
        box-shadow: 0 7px 0 var(--correct-dark);
      }
      .wrong-btn {
        right: clamp(12px, 4vw, 48px);
        background: var(--wrong);
        box-shadow: 0 7px 0 var(--wrong-dark);
      }
      .side-btn:hover {
        transform: translateY(calc(-50% - 2px));
      }
      .side-btn:active {
        transform: translateY(calc(-50% + 5px));
      }
      .side-btn.hidden {
        display: none;
      }

      @media (max-width: 700px) {
        .side-btn {
          position: static;
          transform: none;
          margin: 18px 10px 0;
        }
        .side-btn:hover,
        .side-btn:active {
          transform: none;
        }
        .game-controls {
          display: flex;
          justify-content: center;
        }
      }

      /* 정답 공개 패널 */
      .reveal-panel {
        width: min(680px, 82vw);
        margin-top: 22px;
        text-align: center;
        background: var(--cream);
        border: 6px solid var(--wood);
        padding: clamp(24px, 5vw, 40px) 24px;
        border-radius: 28px;
        box-shadow:
          0 14px 0 rgba(0, 0, 0, 0.15),
          inset 0 0 0 3px rgba(255, 255, 255, 0.6);
        z-index: 2;
        animation: pop 0.4s cubic-bezier(0.22, 1.4, 0.4, 1);
      }
      .reveal-panel.hidden {
        display: none;
      }
      .reveal-panel.panel-correct {
        border-color: var(--correct);
      }
      .reveal-panel.panel-wrong {
        border-color: var(--wrong);
      }
      .reveal-result {
        font-size: clamp(1.2rem, 3vw, 1.6rem);
        margin-bottom: 10px;
      }
      .panel-correct .reveal-result {
        color: var(--correct-dark);
      }
      .panel-wrong .reveal-result {
        color: var(--wrong-dark);
      }
      .reveal-name {
        font-size: clamp(2rem, 7vw, 3.2rem);
        margin-bottom: 20px;
      }
      .continue-btn {
        font-family: inherit;
        font-size: clamp(1rem, 2.4vw, 1.3rem);
        padding: 14px 26px;
        border-radius: 18px;
        border: none;
        background: var(--fire);
        color: #fff;
        cursor: pointer;
        box-shadow: 0 6px 0 var(--fire-dark);
      }
      .continue-btn:hover {
        transform: translateY(-2px);
      }
      .continue-btn:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 var(--fire-dark);
      }

      @keyframes pop {
        0% {
          transform: scale(0.6);
        }
        60% {
          transform: scale(1.08);
        }
        100% {
          transform: scale(1);
        }
      }

      /* ---------- 결과 화면 ---------- */
      .result-card {
        background: var(--cream);
        border: 6px solid var(--wood);
        border-radius: 28px;
        padding: clamp(24px, 5vw, 44px);
        width: min(480px, 90vw);
        text-align: center;
        box-shadow:
          0 14px 0 rgba(0, 0, 0, 0.15),
          inset 0 0 0 3px rgba(255, 255, 255, 0.6);
        margin-bottom: 20px;
      }
      #resultTeam {
        font-size: clamp(1.3rem, 3vw, 1.7rem);
        margin-bottom: 8px;
      }
      #resultScore {
        font-size: clamp(1.8rem, 5vw, 2.6rem);
        margin-bottom: 10px;
        color: var(--tent-dark);
      }
      #resultDetail {
        font-size: clamp(1rem, 2.2vw, 1.2rem);
        color: var(--ink);
      }
      .result-buttons {
        display: flex;
        gap: 14px;
        margin-bottom: 22px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .leaderboard {
        background: var(--cream);
        border: 4px solid var(--wood);
        border-radius: 20px;
        padding: 18px 22px;
        width: min(480px, 90vw);
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15);
      }
      .lb-title {
        font-size: clamp(1.1rem, 2.6vw, 1.3rem);
        margin-bottom: 10px;
        text-align: center;
      }
      .lb-row {
        display: flex;
        justify-content: space-between;
        font-size: clamp(0.9rem, 2vw, 1.05rem);
        padding: 6px 4px;
        border-bottom: 2px dashed var(--wood);
      }
      .lb-row:last-child {
        border-bottom: none;
      }

      /* 홈 버튼 = 텐트 */
      .home-button {
        position: fixed;
        bottom: 24px;
        left: 24px;
        width: 68px;
        height: 68px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        background: var(--cream);
        border: 4px solid var(--wood);
        border-radius: 20px;
        cursor: pointer;
        text-decoration: none;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.15);
        transition: transform 0.12s ease;
        z-index: 3;
      }
      .home-button:hover {
        transform: translateY(-3px) rotate(-4deg);
      }

      @media (prefers-reduced-motion: reduce) {
        .reveal-panel,
        .start-card,
        .image-hidden,
        #timerLabel.urgent,
        .star {
          animation: none;
        }
      }

      /* ===== 모바일 가로모드(TV 연결) 최적화 & 화면 고정 ===== */
      /* html/body 화면에 고정 - 터치 스크롤로 붕 뜨는 현상 방지 */
      html,
      body {
        width: 100%;
        height: 100%;
        position: fixed;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
      }
      /* 화면 컨테이너는 실제 보이는 높이에 딱 맞춤 */
      .container {
        height: 100vh;
        height: 100dvh;
      }
      /* 각 화면은 꽉 채우되 기본은 스크롤 잠금 */
      .screen {
        height: 100%;
        justify-content: center;
        overflow: hidden;
      }
      /* 결과 화면만: 기록이 길어지면 세로 스크롤 허용 */
      #result-screen {
        justify-content: flex-start;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        padding-top: 20px;
        padding-bottom: 40px;
      }

      /* ===== 가로모드: 화면이 낮고 넓을 때 압축 ===== */
      @media (orientation: landscape) and (max-height: 600px) {
        .container {
          padding: 12px;
        }
        .title {
          font-size: clamp(1.4rem, 5vh, 2.2rem);
          margin-bottom: 12px;
        }
        /* 카드류 여백/패딩 축소 */
        .start-card {
          padding: clamp(16px, 4vh, 32px);
          border-radius: 24px;
        }
        .team-input {
          margin-bottom: 14px;
          padding: 10px 14px;
        }
        .field-label {
          margin-bottom: 8px;
        }
        .hud {
          margin-bottom: 12px;
          padding: 8px 18px;
        }
        .count-btn {
          padding: 12px 20px;
        }
        /* 게임 화면 요소 압축 */
        .word-display {
          font-size: clamp(2.2rem, 16vh, 5rem);
          padding: clamp(20px, 5vh, 44px) clamp(28px, 6vw, 60px);
          margin-bottom: 16px;
          border-radius: 24px;
        }
        .image-container img {
          max-height: 60vh;
        }
        .image-hidden {
          min-height: 34vh;
        }
        .reveal-panel {
          margin-top: 12px;
          padding: clamp(14px, 3vh, 26px) 22px;
        }
        .reveal-name {
          margin-bottom: 12px;
        }
        .side-btn {
          width: clamp(56px, 12vh, 84px);
          height: clamp(56px, 12vh, 84px);
        }
        /* 홈 버튼 살짝 작게 */
        .home-button {
          width: 54px;
          height: 54px;
          bottom: 14px;
          left: 14px;
          font-size: 1.6rem;
        }
        /* 별은 가로모드에서 좀 옅게 */
        .star {
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <span class="star">⭐️</span>
      <span class="star">✨</span>
      <span class="star">⭐️</span>
      <span class="star">✨</span>
      <span class="star">🌙</span>
      <span class="star">⭐️</span>

      <!-- 시간 선택 화면 (제일 처음) -->
      <section id="time-screen" class="screen">
        <h1 class="title">⏱</h1>
        <div class="start-card">
          <div class="count-buttons">
            <button class="count-btn" onclick="selectTime(3)">3초</button>
            <button class="count-btn" onclick="selectTime(5)">5초</button>
            <button class="count-btn" onclick="selectTime(0)">무제한</button>
          </div>
        </div>
      </section>

      <!-- 팀 이름 / 문제 수 화면 -->
      <section id="start-screen" class="screen hidden">
        <h1 class="title">🙄 내가 누구게 ?</h1>
        <div class="start-card">
          <label class="field-label" for="teamNameInput">팀 이름</label>
          <input
            id="teamNameInput"
            class="team-input"
            type="text"
            placeholder="예: 1팀"
            maxlength="14"
          />
          <p class="field-label">몇 문제에 도전할까요?</p>
          <div class="count-buttons">
            <button class="count-btn" onclick="startGame(8)">8문제</button>
            <button class="count-btn" onclick="startGame(10)">10문제</button>
          </div>
          <p class="pool-note" id="poolNote"></p>
        </div>
      </section>

      <!-- 게임 화면 -->
      <section id="game-screen" class="screen hidden">
        <div class="hud">
          <span id="teamLabel"></span>
          <span id="progressLabel"></span>
          <span id="scoreLabel"></span>
          <span id="timerLabel"></span>
        </div>

        <div class="image-container">
          <img id="quiz-image" src="" alt="퀴즈 이미지" />
          <div id="image-hidden" class="image-hidden hidden">
            <span class="big-q">🤔</span>
            <span>누구게 ~?</span>
          </div>
        </div>

        <div class="game-controls">
          <button
            id="btnCorrect"
            class="side-btn correct-btn"
            onclick="answer(true)"
          >
            ⚪️
          </button>
          <button
            id="btnWrong"
            class="side-btn wrong-btn"
            onclick="answer(false)"
          >
            ❌
          </button>
        </div>

        <div id="reveal-panel" class="reveal-panel hidden">
          <p id="reveal-result" class="reveal-result"></p>
          <p id="reveal-name" class="reveal-name"></p>
          <button id="continueBtn" class="continue-btn"></button>
        </div>
      </section>

      <!-- 결과 화면 -->
      <section id="result-screen" class="screen hidden">
        <h1 class="title">🏁 결과</h1>
        <div class="result-card">
          <p id="resultTeam"></p>
          <p id="resultScore"></p>
          <p id="resultDetail"></p>
        </div>
        <div class="result-buttons">
          <button class="count-btn" onclick="nextTeam()">다른 팀 ▶</button>
          <button class="count-btn" onclick="resetAll()">처음부터</button>
        </div>
        <div id="leaderboard" class="leaderboard"></div>
      </section>

      <a href="start.html" class="home-button">⛺️</a>
    </div>

    <script>
      const totalImages = 50; // 전체 이미지 개수
      const imageTexts = [

        "미달이",
        "마이클잭슨",
        "페이커",

        "두부",

        "웨렌 버핏",
        "추성훈",
        "안세영",

        "김태리",
        "곽튜브",
        "제니",
        "추영우",
        "마크 저커버그",
        "방탄소년단",
        "신동엽",
        "코난",
        "김우빈",
        "최산",
        "윈터",
        "태연",
      ];

      let quizPool = [];
      let currentIndex = 0;
      let score = 0;
      let teamName = "참가팀";
      let leaderboard = []; // 세션 동안 쌓이는 팀별 기록

      // 세션 동안 남은 인물 풀 (팀 간 중복 방지). 소진되면 다시 채움.
      let remainingPool = [];

      // 시간 제한 관련 (0 = 무제한)
      let timeLimit = 0;
      let timerId = null;
      let remaining = 0;

      const $ = (id) => document.getElementById(id);

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function buildFullPool() {
        const pool = [];
        for (let i = 0; i < totalImages; i++) {
          pool.push({ img: `images/${i + 1}.png`, name: imageTexts[i] });
        }
        return pool;
      }

      // 인물 풀 전체 초기화 (새로 섞기)
      function refillPool() {
        remainingPool = shuffle(buildFullPool());
      }

      // 남은 풀에서 count개 꺼내기 (꺼낸 건 풀에서 제거 -> 다음 팀엔 안 나옴)
      // 남은 게 부족하면 재사용(다시 섞어 채우기). 재사용 시에도 이번 판 안에서는 중복 없음.
      function drawQuestions(count) {
        let drawn = [];
        if (remainingPool.length < count) {
          // 남은 것 먼저 다 꺼내고
          drawn = remainingPool.splice(0, remainingPool.length);
          // 풀 다시 채우기 (재사용)
          refillPool();
          // 방금 꺼낸 인물과 겹치지 않게 나머지 채우기
          const used = new Set(drawn.map((d) => d.name));
          while (drawn.length < count && remainingPool.length > 0) {
            const idx = remainingPool.findIndex((item) => !used.has(item.name));
            if (idx === -1) break;
            const picked = remainingPool.splice(idx, 1)[0];
            drawn.push(picked);
            used.add(picked.name);
          }
        } else {
          drawn = remainingPool.splice(0, count);
        }
        return drawn;
      }

      function updatePoolNote() {
        const note = $("poolNote");
        if (!note) return;
        note.textContent = `남은 인물 ${remainingPool.length}명`;
      }

      function showScreen(id) {
        document
          .querySelectorAll(".screen")
          .forEach((s) => s.classList.add("hidden"));
        $(id).classList.remove("hidden");
        if (id === "start-screen") updatePoolNote();
      }

      // 1단계: 시간 선택 -> 팀 이름 화면으로
      function selectTime(sec) {
        timeLimit = sec;
        showScreen("start-screen");
      }

      // ----- 타이머 -----
      function clearTimer() {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
      }

      function updateTimerLabel() {
        const label = $("timerLabel");
        if (!timeLimit) {
          label.textContent = "⏱ 무제한";
          label.classList.remove("urgent");
          return;
        }
        label.textContent = `⏱ ${remaining}초`;
        label.classList.toggle("urgent", remaining <= 2);
      }

      function hideImage() {
        $("quiz-image").classList.add("hidden");
        $("image-hidden").classList.remove("hidden");
      }

      function startTimer() {
        clearTimer();
        if (!timeLimit) {
          // 무제한: 이미지 계속 표시
          updateTimerLabel();
          return;
        }
        remaining = timeLimit;
        updateTimerLabel();
        timerId = setInterval(() => {
          remaining--;
          if (remaining <= 0) {
            remaining = 0;
            updateTimerLabel();
            hideImage(); // 시간 끝 -> 이미지 사라짐
            clearTimer();
          } else {
            updateTimerLabel();
          }
        }, 1000);
      }

      // 2단계: 게임 시작
      function startGame(count) {
        const inputVal = $("teamNameInput").value.trim();
        teamName = inputVal || "참가팀";
        quizPool = drawQuestions(count); // 중복 제외하고 뽑기
        currentIndex = 0;
        score = 0;
        showScreen("game-screen");
        renderQuestion();
      }

      function renderQuestion() {
        clearTimer();
        $("reveal-panel").classList.add("hidden");
        $("reveal-panel").classList.remove("panel-correct", "panel-wrong");
        $("btnCorrect").classList.remove("hidden");
        $("btnWrong").classList.remove("hidden");

        // 이미지 다시 보이게, 사라짐 자리 숨김
        $("quiz-image").classList.remove("hidden");
        $("image-hidden").classList.add("hidden");
        $("quiz-image").src = quizPool[currentIndex].img;

        $("teamLabel").textContent = `👥 ${teamName}`;
        $("progressLabel").textContent =
          `문제 ${currentIndex + 1} / ${quizPool.length}`;
        $("scoreLabel").textContent = `정답 ${score}개`;

        startTimer(); // 이미지 노출 타이머 시작
      }

      function answer(isCorrect) {
        clearTimer(); // O/X 누르면 타이머 정지
        $("timerLabel").classList.remove("urgent");

        $("btnCorrect").classList.add("hidden");
        $("btnWrong").classList.add("hidden");

        const panel = $("reveal-panel");
        panel.classList.remove("hidden");
        panel.classList.toggle("panel-correct", isCorrect);
        panel.classList.toggle("panel-wrong", !isCorrect);

        $("reveal-result").textContent = isCorrect ? "정답! 🎉" : "땡! 😢";
        $("reveal-name").textContent = quizPool[currentIndex].name;

        if (isCorrect) {
          score++;
          $("scoreLabel").textContent = `정답 ${score}개`;
        }

        const isLast = currentIndex === quizPool.length - 1;
        const btn = $("continueBtn");

        if (isCorrect && !isLast) {
          btn.textContent = "다음 문제 ▶";
          btn.onclick = nextQuestion;
        } else {
          btn.textContent = "결과 보기 🏁";
          btn.onclick = finishGame;
        }
      }

      function nextQuestion() {
        currentIndex++;
        renderQuestion();
      }

      function finishGame() {
        clearTimer();
        const attempted = currentIndex + 1;
        const total = quizPool.length;
        const stoppedEarly = attempted < total;

        leaderboard.unshift({
          name: teamName,
          score,
          attempted,
          total,
          stoppedEarly,
        });

        $("resultTeam").textContent = teamName;
        $("resultScore").textContent = `${score}문제 정답`;

        renderLeaderboard();
        showScreen("result-screen");
      }

      function renderLeaderboard() {
        const el = $("leaderboard");
        if (leaderboard.length === 0) {
          el.innerHTML = "";
          return;
        }
        const rows = leaderboard
          .slice()
          .sort((a, b) => b.score - a.score)
          .map(
            (r, idx) =>
              `<div class="lb-row"><span>${idx + 1}. ${escapeHtml(r.name)}</span><span>${r.score} ${r.stoppedEarly ? " (탈락)" : ""}</span></div>`,
          )
          .join("");
        el.innerHTML = `<h3 class="lb-title">🏆 팀별 기록</h3>${rows}`;
      }

      // 다른 팀: 남은 풀 유지(= 이전에 나온 이미지 제외), 기록 유지, 팀 이름만 새로
      function nextTeam() {
        showScreen("start-screen");
        $("teamNameInput").value = "";
        $("teamNameInput").focus();
      }

      // 처음부터: 모두 초기화 (인물 풀 전체 복구 + 기록 삭제 + 시간 선택부터)
      function resetAll() {
        clearTimer();
        refillPool(); // 인물 풀 전체 초기화
        leaderboard = []; // 기록 초기화
        renderLeaderboard();
        score = 0;
        currentIndex = 0;
        teamName = "참가팀";
        $("teamNameInput").value = "";
        showScreen("time-screen");
      }

      // 최초 로드 시 인물 풀 준비
      refillPool();
    </script>
  </body>
</html>
