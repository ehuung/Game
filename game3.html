<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Game</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="theme.css" />
    <style>
      .genre-buttons {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
      }
      .genre-btn.full-width {
        grid-column: 1 / -1;
      }
      .genre-btn {
        font-family: inherit;
        font-size: clamp(1.1rem, 2.6vw, 1.5rem);
        padding: clamp(24px, 5vw, 36px) 12px;
        border-radius: 22px;
        border: none;
        background: var(--tent);
        color: #fff;
        cursor: pointer;
        box-shadow: 0 7px 0 var(--tent-dark);
        transition:
          transform 0.08s ease,
          box-shadow 0.08s ease;
      }
      .genre-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 9px 0 var(--tent-dark);
      }
      .genre-btn:active {
        transform: translateY(5px);
        box-shadow: 0 2px 0 var(--tent-dark);
      }
      .genre-tag {
        display: inline-block;
        background: var(--wood);
        color: var(--ink);
        font-size: clamp(0.85rem, 2vw, 1rem);
        padding: 6px 16px;
        border-radius: 14px;
        margin-bottom: 18px;
      }
      .back-link {
        background: none;
        border: none;
        font-family: inherit;
        color: var(--tent-dark);
        font-size: clamp(0.85rem, 2vw, 1rem);
        text-decoration: underline;
        cursor: pointer;
        margin-top: 18px;
      }
      .word-display {
        font-size: clamp(3rem, 14vw, 8rem);
        font-weight: bold;
        color: var(--ink);
        margin-bottom: 26px;
        padding: clamp(40px, 8vw, 80px) clamp(30px, 6vw, 70px);
        background: var(--cream);
        border-radius: 32px;
        border: 6px solid var(--wood);
        box-shadow:
          0 14px 0 rgba(0, 0, 0, 0.15),
          inset 0 0 0 3px rgba(255, 255, 255, 0.6);
        min-width: min(400px, 80vw);
        letter-spacing: 8px;
        text-align: center;
        z-index: 2;
      }
      .word-display.pop {
        animation: pop 0.45s cubic-bezier(0.22, 1.4, 0.4, 1);
      }
      @media (max-width: 700px) {
        .side-btn {
          position: static;
          transform: none;
          margin: 10px 10px 0;
        }
        .side-btn:hover,
        .side-btn:active {
          transform: none;
        }
        .game-controls {
          display: flex;
          justify-content: center;
        }
        .genre-buttons {
          grid-template-columns: 1fr;
        }
      }

      /* ===== 가로모드: 화면이 낮고 넓을 때 압축 ===== */
      @media (orientation: landscape) and (max-height: 600px) {
        /* 게임 화면 요소 압축 */
        .word-display {
          font-size: clamp(2.2rem, 16vh, 5rem);
          padding: clamp(20px, 5vh, 44px) clamp(28px, 6vw, 60px);
          margin-bottom: 16px;
          border-radius: 24px;
        }
        .image-container img {
          max-height: 60vh;
        }
        .image-hidden {
          min-height: 34vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <span class="star">⭐️</span><span class="star">✨</span
      ><span class="star">⭐️</span> <span class="star">✨</span
      ><span class="star">🌙</span><span class="star">⭐️</span>

      <section id="genre-screen" class="screen">
        <h1 class="title">🔤 초성퀴즈</h1>
        <div class="start-card">
          <div class="genre-buttons">
            <button class="genre-btn" onclick="selectGenre('movie')">
              🎬 영화
            </button>
            <button class="genre-btn" onclick="selectGenre('drama')">
              📺 드라마
            </button>
            <button class="genre-btn" onclick="selectGenre('food')">
              🍔 음식
            </button>
            <button class="genre-btn" onclick="selectGenre('slang')">
              💬 신조어
            </button>
            <button
              class="genre-btn full-width"
              onclick="selectGenre('variety')"
            >
              🎉 예능
            </button>
          </div>
        </div>
      </section>

      <section id="start-screen" class="screen hidden">
        <h1 class="title">🔤 초성퀴즈</h1>
        <div class="start-card">
          <span id="genreTag" class="genre-tag"></span>
          <label class="field-label" for="teamNameInput">팀 이름</label>
          <input
            id="teamNameInput"
            class="team-input"
            type="text"
            placeholder="예: 1팀"
            maxlength="14"
          />
          <p class="field-label">몇 문제에 도전할까요?</p>
          <div class="count-buttons">
            <button class="count-btn" onclick="startGame(4)">4</button>
            <button class="count-btn" onclick="startGame(5)">5</button>
            <button class="count-btn" onclick="startGame(8)">8</button>
            <button class="count-btn" onclick="startGame(10)">10</button>
          </div>
          <p class="pool-note" id="poolNote"></p>
          <br />
          <button class="back-link" onclick="showScreen('genre-screen')">
            ← 다른 장르 선택
          </button>
        </div>
      </section>

      <section id="game-screen" class="screen hidden">
        <div class="hud">
          <span id="teamLabel"></span><span id="genreLabel"></span>
          <span id="progressLabel"></span><span id="scoreLabel"></span>
        </div>
        <div class="word-display" id="wordDisplay"></div>
        <div class="game-controls">
          <button
            id="btnCorrect"
            class="side-btn correct-btn"
            onclick="answer(true)"
          >
            ⚪️
          </button>
          <button
            id="btnWrong"
            class="side-btn wrong-btn"
            onclick="answer(false)"
          >
            ❌
          </button>
        </div>
        <div id="reveal-panel" class="reveal-panel hidden">
          <p id="reveal-result" class="reveal-result"></p>
          <p id="reveal-sub" class="reveal-sub"></p>
          <button id="continueBtn" class="continue-btn"></button>
        </div>
      </section>

      <section id="result-screen" class="screen hidden">
        <h1 class="title">🏁 결과</h1>
        <div class="result-card">
          <p id="resultTeam"></p>
          <p id="resultScore"></p>
          <p id="resultDetail"></p>
        </div>
        <div class="result-buttons">
          <button class="count-btn" onclick="nextTeam()">다른 팀 ▶</button>
          <button class="count-btn" onclick="resetAll()">처음부터</button>
        </div>
        <div id="leaderboard" class="leaderboard"></div>
      </section>

      <a href="start.html" class="home-button">⛺️</a>
    </div>

    <script>
      const GENRES = {
        movie: {
          label: "🎬 영화",
          words: [
            "눈동자",
            "명량",
            "극한직업",
            "신과함께",
            "베테랑",
            "택시운전사",
            "부산행",
            "왕의남자",
            "해운대",
            "광해",
            "국제시장",
            "도둑들",
            "암살",
            "신세계",
            "곡성",
            "기생충",
            "범죄도시",
            "써니",
            "타짜",
            "살인의추억",
            "완벽한타인",
          ],
        },
        drama: {
          label: "📺 드라마",
          words: [
            "김부장",
            "아파트",
            "동궁",
            "도깨비",
            "시그널",
            "이태원클라쓰",
            "스카이캐슬",
            "미스터션샤인",
            "킹덤",
            "오징어게임",
            "더글로리",
            "사랑의불시착",
            "이상한변호사우영우",
            "슬기로운의사생활",
            "부부의세계",
            "동백꽃필무렵",
            "화유기",
            "낭만닥터김사부",
            "미생",
            "태양의후예",
            "별에서온그대",
            "펜트하우스",
            "옷소매붉은끝동",
          ],
        },
        food: {
          label: "🍔 음식",
          words: [
            "김치찌개",
            "된장찌개",
            "삼겹살",
            "비빔밥",
            "떡볶이",
            "순대국밥",
            "잡채",
            "갈비탕",
            "냉면",
            "부대찌개",
            "닭갈비",
            "감자탕",
            "육개장",
            "칼국수",
            "짜장면",
            "짬뽕",
            "탕수육",
            "마라탕",
            "곱창전골",
            "도토리묵",
          ],
        },
        slang: {
          label: "💬 신조어",
          words: [
            "얼죽아",
            "플렉스",
            "알잘딱깔쎈",
            "중꺽마",
            "이왜진",
            "갓생",
            "야르",
            "샤갈",
            "영크크",
            "감다뒤",
            "영포티",
            "느좋",
          ],
        },
        variety: {
          label: "🎉 예능",
          words: [
            "무한도전",
            "런닝맨",
            "아는형님",
            "환승연애",
            "신서유기",
            "솔로지옥",
            "삼시세끼",
            "놀라운토요일",
            "유퀴즈온더블럭",
            "나혼자산다",
            "미운우리새끼",
            "전지적참견시점",
            "코미디빅리그",
            "언더커버",
            "흑백요리사",
            "골때리는그녀들",
            "피의게임",
            "끼리끼리",
            "불량연애",
            "냉장고를부탁해",
            "모태솔로지만연애는하고싶어",
          ],
        },
      };

      let currentGenreKey = null;
      let quizPool = [];
      let currentIndex = 0;
      let score = 0;
      let teamName = "참가팀";
      let leaderboard = [];
      // 장르별로 남은 문제 풀을 따로 관리 (팀 간 중복 방지)
      let remainingByGenre = {};

      const $ = (id) => document.getElementById(id);
      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      const CHO = [
        "ㄱ",
        "ㄲ",
        "ㄴ",
        "ㄷ",
        "ㄸ",
        "ㄹ",
        "ㅁ",
        "ㅂ",
        "ㅃ",
        "ㅅ",
        "ㅆ",
        "ㅇ",
        "ㅈ",
        "ㅉ",
        "ㅊ",
        "ㅋ",
        "ㅌ",
        "ㅍ",
        "ㅎ",
      ];
      function getChosung(char) {
        const code = char.charCodeAt(0) - 0xac00;
        if (code < 0 || code > 11171) return char;
        return CHO[Math.floor(code / 588)];
      }
      function toChosungString(str) {
        return [...str].map(getChosung).join("");
      }
      function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function buildFullPool(key) {
        return GENRES[key].words.map((w) => ({
          chosung: toChosungString(w),
          full: w,
        }));
      }
      // 특정 장르 풀 초기화(새로 섞기)
      function refillGenre(key) {
        remainingByGenre[key] = shuffle(buildFullPool(key));
      }
      // 모든 장르 풀 초기화
      function refillAll() {
        Object.keys(GENRES).forEach(refillGenre);
      }

      function drawQuestions(count) {
        const key = currentGenreKey;
        if (!remainingByGenre[key] || remainingByGenre[key].length < count) {
          refillGenre(key);
        }
        return remainingByGenre[key].slice(0, count);
      }
      function updatePoolNote() {
        const note = $("poolNote");
        if (note && currentGenreKey)
          note.textContent = `남은 문제 ${remainingByGenre[currentGenreKey].length}개`;
      }

      function showScreen(id) {
        document
          .querySelectorAll(".screen")
          .forEach((s) => s.classList.add("hidden"));
        $(id).classList.remove("hidden");
        if (id === "start-screen") updatePoolNote();
      }

      function selectGenre(key) {
        currentGenreKey = key;
        $("genreTag").textContent = GENRES[key].label;
        showScreen("start-screen");
      }

      function startGame(count) {
        const inputVal = $("teamNameInput").value.trim();
        teamName = inputVal || "참가팀";
        quizPool = drawQuestions(count);
        currentIndex = 0;
        score = 0;
        showScreen("game-screen");
        renderQuestion();
      }

      function renderQuestion() {
        $("reveal-panel").classList.add("hidden");
        $("reveal-panel").classList.remove("panel-correct", "panel-wrong");
        $("btnCorrect").classList.remove("hidden");
        $("btnWrong").classList.remove("hidden");
        const wd = $("wordDisplay");
        wd.style.display = "";
        wd.textContent = quizPool[currentIndex].chosung;
        wd.classList.remove("pop");
        void wd.offsetWidth;
        wd.classList.add("pop");
        $("teamLabel").textContent = `👥 ${teamName}`;
        $("genreLabel").textContent = GENRES[currentGenreKey].label;
        $("progressLabel").textContent =
          `문제 ${currentIndex + 1} / ${quizPool.length}`;
        $("scoreLabel").textContent = `정답 ${score}개`;
      }

      function answer(isCorrect) {
        $("btnCorrect").classList.add("hidden");
        $("btnWrong").classList.add("hidden");
        $("wordDisplay").style.display = "none";
        const panel = $("reveal-panel");
        panel.classList.remove("hidden");
        panel.classList.toggle("panel-correct", isCorrect);
        panel.classList.toggle("panel-wrong", !isCorrect);
        $("reveal-result").textContent = isCorrect ? "정답! 🎉" : "땡! 😢";
        $("reveal-sub").textContent = `정답: ${quizPool[currentIndex].full}`;
        if (isCorrect) {
          score++;
          $("scoreLabel").textContent = `정답 ${score}개`;
        }
        const isLast = currentIndex === quizPool.length - 1;
        const btn = $("continueBtn");
        if (isCorrect && !isLast) {
          btn.textContent = "다음 문제 ▶";
          btn.onclick = nextQuestion;
        } else {
          btn.textContent = "결과 보기 🏁";
          btn.onclick = finishGame;
        }
      }

      function nextQuestion() {
        currentIndex++;
        renderQuestion();
      }

      function finishGame() {
        const attempted = currentIndex + 1; // 실제로 나온 문제 수
        const total = quizPool.length;
        const stoppedEarly = attempted < total;
        // 이번 장르 풀에서, 실제로 나온 문제만 제거 (안 나온 건 남음)
        const key = currentGenreKey;
        const usedWords = new Set(
          quizPool.slice(0, attempted).map((q) => q.full),
        );
        remainingByGenre[key] = remainingByGenre[key].filter(
          (p) => !usedWords.has(p.full),
        );
        leaderboard.unshift({
          name: teamName,
          score,
          attempted,
          total,
          stoppedEarly,
          genreLabel: GENRES[key].label,
        });
        $("resultTeam").textContent = teamName;
        $("resultScore").textContent = `${score}문제 정답`;
        renderLeaderboard();
        showScreen("result-screen");
      }

      function renderLeaderboard() {
        const el = $("leaderboard");
        if (leaderboard.length === 0) {
          el.innerHTML = "";
          return;
        }
        const rows = leaderboard
          .slice()
          .sort((a, b) => b.score - a.score)
          .map(
            (r, idx) =>
              `<div class="lb-row"><span class="lb-name">${idx + 1}. ${escapeHtml(r.name)} <small>(${escapeHtml(r.genreLabel)})</small></span><span>${r.score} ${r.stoppedEarly ? " (탈락)" : ""}</span></div>`,
          )
          .join("");
        el.innerHTML = `<h3 class="lb-title">🏆 팀별 기록</h3>${rows}`;
      }

      // 다른 팀: 장르별 남은 풀 유지(중복 제외), 기록 유지, 팀 이름만 새로 -> 장르 선택부터
      function nextTeam() {
        showScreen("genre-screen");
        $("teamNameInput").value = "";
      }

      // 처음부터: 모두 초기화 (모든 장르 풀 복구 + 기록 삭제)
      function resetAll() {
        refillAll();
        leaderboard = [];
        renderLeaderboard();
        score = 0;
        currentIndex = 0;
        teamName = "참가팀";
        currentGenreKey = null;
        $("teamNameInput").value = "";
        showScreen("genre-screen");
      }

      // 최초 로드 시 모든 장르 풀 준비
      refillAll();
    </script>
  </body>
</html>
