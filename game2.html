<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Game</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="theme.css" />
    <style>
      .word-display {
        font-size: clamp(3rem, 14vw, 8rem);
        font-weight: bold;
        color: var(--ink);
        margin-bottom: 26px;
        padding: clamp(40px, 8vw, 80px) clamp(30px, 6vw, 70px);
        background: var(--cream);
        border-radius: 32px;
        border: 6px solid var(--wood);
        box-shadow:
          0 14px 0 rgba(0, 0, 0, 0.15),
          inset 0 0 0 3px rgba(255, 255, 255, 0.6);
        min-width: min(400px, 80vw);
        text-align: center;
        z-index: 2;
      }
      .word-display.pop {
        animation: pop 0.45s cubic-bezier(0.22, 1.4, 0.4, 1);
      }
      @media (max-width: 700px) {
        .side-btn {
          position: static;
          transform: none;
          margin: 10px 10px 0;
        }
        .side-btn:hover,
        .side-btn:active {
          transform: none;
        }
        .game-controls {
          display: flex;
          justify-content: center;
        }
      }

      /* ===== 가로모드: 화면이 낮고 넓을 때 압축 ===== */
      @media (orientation: landscape) and (max-height: 600px) {
        /* 게임 화면 요소 압축 */
        .word-display {
          font-size: clamp(2.2rem, 16vh, 5rem);
          padding: clamp(20px, 5vh, 44px) clamp(28px, 6vw, 60px);
          margin-bottom: 16px;
          border-radius: 24px;
        }
        .image-container img {
          max-height: 60vh;
        }
        .image-hidden {
          min-height: 34vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <span class="star">⭐️</span><span class="star">✨</span
      ><span class="star">⭐️</span> <span class="star">✨</span
      ><span class="star">🌙</span><span class="star">⭐️</span>

      <section id="start-screen" class="screen">
        <h1 class="title">🎤 이어말하기 !</h1>
        <div class="start-card">
          <label class="field-label" for="teamNameInput">팀 이름</label>
          <input
            id="teamNameInput"
            class="team-input"
            type="text"
            placeholder="예: 1팀"
            maxlength="14"
          />
          <p class="field-label">몇 문제에 도전할까요?</p>
          <div class="count-buttons">
            <button class="count-btn" onclick="startGame(4)">4</button>
            <button class="count-btn" onclick="startGame(5)">5</button>
            <button class="count-btn" onclick="startGame(8)">8</button>
            <button class="count-btn" onclick="startGame(10)">10</button>
          </div>
          <p class="pool-note" id="poolNote"></p>
        </div>
      </section>

      <section id="game-screen" class="screen hidden">
        <div class="hud">
          <span id="teamLabel"></span><span id="progressLabel"></span
          ><span id="scoreLabel"></span>
        </div>
        <div class="word-display" id="wordDisplay"></div>
        <div class="game-controls">
          <button
            id="btnCorrect"
            class="side-btn correct-btn"
            onclick="answer(true)"
          >
            ⚪️
          </button>
          <button
            id="btnWrong"
            class="side-btn wrong-btn"
            onclick="answer(false)"
          >
            ❌
          </button>
        </div>
        <div id="reveal-panel" class="reveal-panel hidden">
          <p id="reveal-result" class="reveal-result"></p>
          <p id="reveal-sub" class="reveal-sub"></p>
          <button id="continueBtn" class="continue-btn"></button>
        </div>
      </section>

      <section id="result-screen" class="screen hidden">
        <h1 class="title">🏁 결과</h1>
        <div class="result-card">
          <p id="resultTeam"></p>
          <p id="resultScore"></p>
          <p id="resultDetail"></p>
        </div>
        <div class="result-buttons">
          <button class="count-btn" onclick="nextTeam()">다른 팀 ▶</button>
          <button class="count-btn" onclick="resetAll()">처음부터</button>
        </div>
        <div id="leaderboard" class="leaderboard"></div>
      </section>

      <a href="start.html" class="home-button">⛺️</a>
    </div>

    <script>
      const wordList = [
        "도원결의",
        "치즈버거",
        "누네띠네",
        "어장관리",
        "카페베네",
        "브로콜리",
        "초코파이",
        "된장찌개",
        "삼각김밥",
        "서울특별시",
        "호랑나비",
        "개미핥기",
        "현장학습",
        "신용카드",
        "마요네즈",
        "플라밍고",
        "딱따구리",
        "감자튀김",
        "업데이트",
        "비트코인",
        "아이스크림",
        "바나나킥",
        "하와이안",
        "딸기우유",
        "레몬에이드",
        "우유부단",
        "이심전심",
        "자수성가",
        "팔방미인",
        "부대찌개",
        "계란말이",
        "타코야키",
        "마라샹궈",
        "회전초밥",
        "도토리묵",
        "아메리카노",
        "카페라떼",
        "스마트폰",
        "요가매트",
        "워터파크",
        "초등학교",
        "놀이공원",
        "지하철역",
        "반려동물",
      ];

      let quizPool = [];
      let currentIndex = 0;
      let score = 0;
      let teamName = "참가팀";
      let leaderboard = [];
      // 세션 동안 남은 문제 풀 (팀 간 중복 방지). 소진되면 다시 채움.
      let remainingPool = [];

      const $ = (id) => document.getElementById(id);
      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }
      function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function buildFullPool() {
        return wordList.map((w) => ({ hint: w.slice(0, 2), full: w }));
      }
      function refillPool() {
        remainingPool = shuffle(buildFullPool());
      }
      function drawQuestions(count) {
        if (remainingPool.length < count) refillPool();
        return remainingPool.slice(0, count);
      }
      function updatePoolNote() {
        const note = $("poolNote");
        if (note) note.textContent = `남은 문제 ${remainingPool.length}개`;
      }

      function showScreen(id) {
        document
          .querySelectorAll(".screen")
          .forEach((s) => s.classList.add("hidden"));
        $(id).classList.remove("hidden");
        if (id === "start-screen") updatePoolNote();
      }

      function startGame(count) {
        const inputVal = $("teamNameInput").value.trim();
        teamName = inputVal || "참가팀";
        quizPool = drawQuestions(count);
        currentIndex = 0;
        score = 0;
        showScreen("game-screen");
        renderQuestion();
      }

      function renderQuestion() {
        $("reveal-panel").classList.add("hidden");
        $("reveal-panel").classList.remove("panel-correct", "panel-wrong");
        $("btnCorrect").classList.remove("hidden");
        $("btnWrong").classList.remove("hidden");
        const wd = $("wordDisplay");
        wd.style.display = "";
        wd.textContent = quizPool[currentIndex].hint;
        wd.classList.remove("pop");
        void wd.offsetWidth;
        wd.classList.add("pop");
        $("teamLabel").textContent = `👥 ${teamName}`;
        $("progressLabel").textContent =
          `문제 ${currentIndex + 1} / ${quizPool.length}`;
        $("scoreLabel").textContent = `정답 ${score}개`;
      }

      function answer(isCorrect) {
        $("btnCorrect").classList.add("hidden");
        $("btnWrong").classList.add("hidden");
        $("wordDisplay").style.display = "none";
        const panel = $("reveal-panel");
        panel.classList.remove("hidden");
        panel.classList.toggle("panel-correct", isCorrect);
        panel.classList.toggle("panel-wrong", !isCorrect);
        $("reveal-result").textContent = isCorrect ? "정답! 🎉" : "땡! 😢";
        $("reveal-sub").textContent = `제시어: ${quizPool[currentIndex].full}`;
        if (isCorrect) {
          score++;
          $("scoreLabel").textContent = `정답 ${score}개`;
        }
        const isLast = currentIndex === quizPool.length - 1;
        const btn = $("continueBtn");
        if (isCorrect && !isLast) {
          btn.textContent = "다음 문제 ▶";
          btn.onclick = nextQuestion;
        } else {
          btn.textContent = "결과 보기 🏁";
          btn.onclick = finishGame;
        }
      }

      function nextQuestion() {
        currentIndex++;
        renderQuestion();
      }

      function finishGame() {
        const attempted = currentIndex + 1; // 실제로 나온 문제 수
        const total = quizPool.length;
        const stoppedEarly = attempted < total;
        // 실제로 나온 문제만 풀에서 제거 (안 나온 건 남음)
        const usedWords = new Set(
          quizPool.slice(0, attempted).map((q) => q.full),
        );
        remainingPool = remainingPool.filter((p) => !usedWords.has(p.full));
        leaderboard.unshift({
          name: teamName,
          score,
          attempted,
          total,
          stoppedEarly,
        });
        $("resultTeam").textContent = teamName;
        $("resultScore").textContent = `${score}문제 정답`;
        renderLeaderboard();
        showScreen("result-screen");
      }

      function renderLeaderboard() {
        const el = $("leaderboard");
        if (leaderboard.length === 0) {
          el.innerHTML = "";
          return;
        }
        const rows = leaderboard
          .slice()
          .sort((a, b) => b.score - a.score)
          .map(
            (r, idx) =>
              `<div class="lb-row"><span>${idx + 1}. ${escapeHtml(r.name)}</span><span>${r.score} ${r.stoppedEarly ? " (탈락)" : ""}</span></div>`,
          )
          .join("");
        el.innerHTML = `<h3 class="lb-title">🏆 팀별 기록</h3>${rows}`;
      }

      // 다른 팀: 남은 풀 유지(중복 제외), 기록 유지, 팀 이름만 새로
      function nextTeam() {
        showScreen("start-screen");
        $("teamNameInput").value = "";
        $("teamNameInput").focus();
      }

      // 처음부터: 모두 초기화
      function resetAll() {
        refillPool();
        leaderboard = [];
        renderLeaderboard();
        score = 0;
        currentIndex = 0;
        teamName = "참가팀";
        $("teamNameInput").value = "";
        showScreen("start-screen");
      }

      refillPool();
    </script>
  </body>
</html>
